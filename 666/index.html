<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таблицы</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <table>
    <caption>Статистика игороков</caption>
    <tr>
      <th>Имя</th>
     <th>Количество очков</th>
    </tr>
    <tr>
      <th colspan="2">Игрок 1</th>
    </tr>
    <tr>
      <td>Игрок 2</td>
     <td>123</td>
    </tr>
  </table>
  
 <table>
  <tr>
    <td rowspan="2">Большая ячейка</td>
    <td>Маленькая ячейка</td>
  </tr>
  <tr>
    <td>Маленькая ячейка</td>
  </tr>
</table>


</body>
</html>
